<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Laptop Companion</title>
    <link rel="stylesheet" href="style.css"> <link rel="stylesheet" href="nav.css">   <link rel="stylesheet" href="signin.css"> <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="dark-mode">

    <aside class="sidebar-pc">
        <nav class="side-links">
            <a href="index.html" class="side-item">
                <span class="icon-black">🏠</span>
                <span class="side-text">Home</span>
            </a>
            <div class="side-item">
                <span class="icon-black">💡</span>
                <span class="side-text">Laptop Care</span>
            </div>
            <a href="signin.html" class="side-item active"> <span class="icon-black">👤</span>
                <span class="side-text">Profile</span>
            </a>
        </nav>
    </aside>

    <div class="page-wrapper">
        <header class="header-tab">
            <div class="title-pill">
                <h1>LAPTOP COMPANION</h1>
            </div>
        </header>

        <main class="content-area">
            <div class="profile-preview-blur"></div>

            <div id="auth-selection" class="auth-overlay">
                <div class="button-stack">
                    <button class="btn-main" onclick="showSignIn()">SIGN IN</button>
                    <a href="signup.html" class="btn-alt">SIGN UP</a>
                </div>
            </div>

            <div id="signin-form-card" class="form-card hidden">
                <h2 class="form-title">WELCOME BACK</h2>
                <form id="login-form">
                    <div class="input-group">
                        <input type="text" id="login-username" placeholder="USERNAME OR EMAIL" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="login-password" placeholder="PASSWORD" required>
                    </div>
                    <button type="submit" class="btn-submit">LOG IN</button>
                    <button type="button" class="btn-back" onclick="showSelection()">BACK</button>
                </form>
            </div>
        </main>

        <nav class="bottom-nav">
            <div class="nav-container">
                <a href="#" class="nav-btn">
                    <span class="icon-black">💡</span>
                </a>
                <a href="index.html" class="nav-btn">
                    <span class="icon-black">🏠</span>
                </a>
                <a href="signin.html" class="nav-btn active"> <div class="home-circle">
                        <span class="icon-black">👤</span>
                    </div>
                </a>
            </div>
        </nav>
    </div>

    <script src="signin.js"></script>
</body>
</html>
