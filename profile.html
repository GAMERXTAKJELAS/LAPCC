<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Laptop Companion</title>
    <link rel="stylesheet" href="nav.css">
    <link rel="stylesheet" href="profile.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        // FIXED THEME SHIELD
        (function() {
            const savedTheme = localStorage.getItem('app-theme') || 'dark';
            // Apply to documentElement for CSS variables
            document.documentElement.className = savedTheme + '-theme';
            // Also apply to body for nav.css compatibility
            document.addEventListener('DOMContentLoaded', () => {
                document.body.className = 'profile-page ' + savedTheme + '-theme';
            });
        })();
    </script>
</head>
<body class="profile-page">

    <aside class="sidebar-pc">
        <nav class="side-links">
            <a href="homepage.html" class="side-item">
                <span class="icon-black">🏠</span>
                <span class="side-text">Home</span>
            </a>
            <a href="laptopcare.html" class="side-item">
                <span class="icon-black">💡</span>
                <span class="side-text">Laptop Care</span>
            </a>
            <a href="profile.html" class="side-item active">
                <span class="icon-black">👤</span>
                <span class="side-text">Profile</span>
            </a>
        </nav>
    </aside>

    <div class="app-shell">
        <header class="profile-header">
            <div class="header-spacer"></div> 
            <h1 class="page-title">PROFILE</h1>
            <div class="header-right">
                <a href="index.html" class="logout-link" title="Logout">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </a>
            </div>
        </header>

        <main class="profile-content">
            <div class="profile-card">
                <h2 class="user-greeting">HELLO, SYAMSUL</h2>
                
                <div class="avatar-container">
                    <div class="avatar-circle">
                        <img src="https://i.pravatar.cc/150?u=syamsul" alt="User Profile" id="user-avatar">
                    </div>
                </div>

                <div class="action-group">
                    <a href="editprofile.html" class="full-width-link">
                        <button class="outline-btn">EDIT PROFILE</button>
                    </a>
                    <div class="email-pill" id="current-email">syamsul.nazir@email.com</div>
                    <button class="outline-btn secondary" id="open-modal">CHANGE EMAIL</button>
                </div>

                <div class="card-footer">
                    <a href="settings.html" class="footer-link">SETTINGS</a>
                    <span class="footer-divider">|</span>
                    <a href="aboutus.html" class="footer-link">ABOUT US</a>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <div class="nav-container">
                <a href="laptopcare.html" class="nav-btn"><span class="icon-black">💡</span></a>
                <a href="homepage.html" class="nav-btn"><span class="icon-black">🏠</span></a>
                <a href="profile.html" class="nav-btn">
                    <div class="home-circle"><span class="icon-black">👤</span></div>
                </a>
            </div>
        </nav>
    </div>

    <div class="modal-overlay" id="email-modal">
        <div class="modal-card">
            <h3 style="margin-bottom: 10px; color: var(--clr-primary);">Change Email</h3>
            <input type="email" class="modal-input" id="new-email-input" placeholder="Enter new email address">
            <div class="modal-actions">
                <button class="modal-btn cancel" id="close-modal">Cancel</button>
                <button class="modal-btn confirm" id="save-email">Save</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="profile.js"></script>
</body>
</html>
