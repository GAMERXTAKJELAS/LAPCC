<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Tips - LAPCC Admin</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="tip.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        // Security Shield
        (function() {
            if (localStorage.getItem('user-role') !== 'admin') {
                alert("Access Denied.");
                window.location.href = "homepage.html";
            }
        })();
    </script>
</head>
<body class="admin-page">

    <div class="admin-wrapper">
        <header class="admin-header">
            <div class="header-left">
                <a href="admin.html" class="back-link">⬅ Back</a>
                <h1>TIP MANAGEMENT</h1>
            </div>
            <button class="add-tip-btn" id="open-upload-modal">+</button>
        </header>

        <!-- Container for the managed tips -->
        <div id="tips-container" class="management-grid">
            <!-- Tips will be injected here by JS -->
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="upload-modal">
        <div class="modal-card">
            <h3>Add New Tip</h3>
            
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="tip-title" placeholder="e.g. Clean your Fans">
            </div>

            <div class="upload-mode-tabs">
                <button class="mode-tab active" data-mode="file">Local File</button>
                <button class="mode-tab" data-mode="link">Web Link</button>
            </div>

            <div id="file-section" class="mode-content">
                <div class="form-group">
                    <label>Upload Image or Video</label>
                    <input type="file" id="tip-file" accept="image/*,video/*">
                    <div id="file-preview-container"></div>
                </div>
            </div>

            <div id="link-section" class="mode-content" style="display: none;">
                <div class="form-group">
                    <label>Paste URL (YouTube/Web)</label>
                    <input type="url" id="tip-url" placeholder="https://youtube.com/...">
                </div>
            </div>

            <div class="form-group">
                <label>Caption</label>
                <textarea id="tip-caption" rows="3" placeholder="Explain the tip..."></textarea>
            </div>

            <div class="modal-actions">
                <button class="modal-btn cancel" id="close-modal">Cancel</button>
                <button class="modal-btn confirm" id="save-tip">Save Tip</button>
            </div>
        </div>
    </div>

    <script src="tip.js"></script>
</body>
</html>
